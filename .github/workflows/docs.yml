name: Docs

# Builds the documentation site from docs/source and, on main, deploys it to GitHub Pages
# (https://emlab-solutions.github.io/pyemaps/). On a pull request the built site is
# uploaded as the "docs-site" artifact for review instead.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.py'
      - 'diffract/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.py'
      - 'diffract/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    # The API pages import pyemaps, which imports emaps; emaps ships Windows wheels only.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KMP_DUPLICATE_LIB_OK: 'TRUE'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the docs tools and pyemaps
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          python -m pip install -r docs\requirements.txt
          python build_pyemaps -v 0.0.0.dev0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Without its dependency check: a release-prep commit can require an emaps
          # version that isn't on PyPI yet, and the API pages only need emaps' Python layer.
          python -m pip install --no-deps dist\pyemaps-0.0.0.dev0-py3-none-any.whl
          python -m pip install emaps numpy matplotlib

      - name: Build the site
        run: |
          sphinx-build -E -b html docs\source docs\_build\html 2>&1 | Tee-Object -FilePath sphinx.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $warnings = (Select-String -Path sphinx.log -Pattern 'WARNING|ERROR').Count
          "Sphinx warnings and errors: $warnings" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/_build/html

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
