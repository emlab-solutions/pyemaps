name: Retargeted pull request

# A pull request opened against another branch, such as one stacked on another pull request,
# gets no Sanity tests run, and changing its base to main later is an "edited" event, which
# the Sanity tests don't start on. Its required checks (Python 3.12 to 3.15) are then missing.
#
# The Sanity tests can't simply start on "edited" too: title and description edits are
# "edited" events, and a Sanity run whose jobs are skipped hides the checks of the run before
# it, so a pull request whose checks had passed showed as blocked. Instead, when a pull
# request's base changes to main, this starts the Sanity tests on its branch. Their checks
# land on the pull request's head commit, as the pull request's own run would.

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  actions: write

jobs:
  start:
    name: Start the Sanity tests
    # only when the base changed, and for a branch of this repository
    if: github.event.changes.base && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the Sanity tests on the pull request's branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run pyemaps_nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
