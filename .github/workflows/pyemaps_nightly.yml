name: Sanity tests

# Builds pyemaps from this commit, installs it with the published emaps backend for
# each supported Python, and compares the samples, features and unit tests with
# their stored baselines (test/ci_sanity.py). A mismatch fails the job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Python ${{ matrix.python }}
    # emaps ships Windows wheels only. windows-latest avoids pinning an image
    # GitHub later retires (windows-2019 was, and the old workflow then queued forever).
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    env:
      KMP_DUPLICATE_LIB_OK: 'TRUE'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install pyemaps
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          python build_pyemaps -v 0.0.0.dev0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # pip pulls emaps (the newest on PyPI that satisfies setup.py) plus numpy and matplotlib
          python -m pip install dist\pyemaps-0.0.0.dev0-py3-none-any.whl

      - name: Check the installation
        # From outside the checkout, so the installed package is imported
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip list
          python -c "import emaps, pyemaps, importlib.metadata as m; print('emaps', m.version('emaps'), 'PKG_TYPE', emaps.PKG_TYPE, '| pyemaps', m.version('pyemaps'))"
          pyemaps -v

      - name: Sanity tests
        run: python test\ci_sanity.py

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanity-logs-py${{ matrix.python }}
          path: sanity-logs/
          if-no-files-found: ignore
